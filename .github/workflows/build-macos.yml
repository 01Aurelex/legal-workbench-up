name: build-macos

# 在 GitHub 托管的 macOS 机器上构建「苹果电脑可运行版本」，产出 .dmg / .app 构件。
#
# 为什么必须由 CI 来构建：
#   PyInstaller、Cython 原生扩展、Rust 外壳都无法跨平台交叉编译，
#   macOS 包只能在真实的 macOS 上产出（Windows 机器上做不到）。
#   本仓库为公开仓库，GitHub 托管的 macOS runner 免费、不限时长。
#
# 产物：
#   构件 legal-workbench-macos-{arm64,x64}
#     ├── 法岩律师本地工作台_<版本>_aarch64.dmg / _x64.dmg    ← 拖进「应用程序」即可
#     └── 法岩律师本地工作台_<arch>.app.zip                    ← ditto 打包，保留符号链接
#
# 注意：本工作流产出的包是 **ad-hoc 签名（未公证）** 的，
#   Apple Silicon 上必须有签名才能运行，因此 CI 里显式使用 identity "-"；
#   首次打开需按 README 的「首次运行」小节放行 Gatekeeper。

on:
  workflow_dispatch:
  # 只在会实质影响 macOS 产物的路径变化时触发——一次 macOS 构建要跑几十分钟，
  # 不该被改个 README 之类的事情白白触发。
  push:
    branches: ["main"]
    # 打 v* 标签 = 正式发布：构建完成后会把 dmg/zip 挂到同名 Release 上。
    tags: ["v*"]
    paths:
      - "build/**"
      - "server/**"
      - "frontend/**"
      - "src-tauri/**"
      - "tools/**"
      - "requirements.txt"
      - "package.json"
      - ".github/workflows/build-macos.yml"

permissions:
  # 需要写权限才能把 dmg / zip 挂到 Release（见末尾「发布到 GitHub Release」一步）。
  # 为什么必须挂 Release：Actions 的构件下载**要求登录 GitHub**，普通用户点开
  # artifact 链接只会看到登录页；只有 Release 资产才有免登录的公开直链。
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # Apple Silicon (M 系列)
            arch: arm64
          - runner: macos-15-intel # Intel Mac
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Python 依赖
        # 与 requirements.txt 保持"核心一致"：
        #   · OCR / 语音等重型引擎（rapidocr / faster-whisper / ctranslate2 / onnxruntime）
        #     已被 legal-workbench.spec 的 excludes 排除出发行包，且均为函数内延迟导入，
        #     装它们只会拖长构建时间，故不装。
        #   · 但 spec 的 hiddenimports 显式声明了 pkg_resources / setuptools / numpy，
        #     且 requirements.txt 明确要求 setuptools<81（81+ 已移除 pkg_resources）。
        #     这里必须一并装，否则 macOS 包与 Windows 发行版会出现依赖差异。
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn>=0.29" python-multipart python-docx \
            cryptography Pillow watchdog pypdf openpyxl requests numpy "setuptools<81" \
            cython pyinstaller

      - name: 先跑 spec 执行回归测试（1 秒，避免白烧一轮 macOS 构建）
        # PyInstaller 用 exec() 执行 .spec，命名空间里没有 __file__；
        # 这个坑曾让 macOS 构建连续失败两轮，且语法检查发现不了。
        run: python tests/check_spec_paths.py

      - name: 检查 shell 脚本里的「全角字符吃变量名」陷阱（1 秒）
        # macOS runner 的 bash 是 /bin/bash 3.2.57，`$tag（` 会被解析成变量 `tag（`，
        # 在 set -u 下整步 0 秒失败。bash -n 查不出来，本地 Git Bash 5.x 也复现不了，
        # 只能靠这个静态扫描兜住——发布步骤曾因此连续失败。
        run: python tests/check_shell_multibyte_vars.py .

      - name: 构建 sidecar（Cython 原生化 + PyInstaller）
        run: bash tools/build_sidecar.sh

      - name: 失败时把构建日志转成注解（便于远程诊断）
        # CI 失败日志只有仓库管理员能在网页看（REST /logs 需要 admin 权限），
        # 但 check-run 的 annotations 接口对公开仓库可匿名读取。
        # 这一步把日志尾部 + 编译器环境信息发成一条 ::error:: 注解，
        # 任何人拿到运行链接都能直接读到报错原文，不必让仓库主人手工复制。
        if: failure()
        run: python tools/ci_dump_build_log.py build

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-log-${{ matrix.arch }}
          path: |
            build/_build_all.log
            build/_step_*.log
            build/_pyi_build.log
            build/_pyi_build.log.crash
          if-no-files-found: warn

      - name: 安装前端依赖
        run: npm install

      - name: 打包 .app / .dmg（ad-hoc 签名）
        # --bundles 显式指定，双保险：即便平台配置 tauri.macos.conf.json 未被合并，
        # 也不会退回到基础配置里的 nsis 目标（macOS 上会直接报错）。
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --bundles app,dmg

      - name: 校验产物、sidecar 落位与签名
        shell: bash
        run: |
          set -euo pipefail

          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app" || { echo "::error::没有产出 .app"; exit 1; }
          echo "app = $app"

          # 最容易静默失败的一步：sidecar 有没有真的被复制进 Resources
          sidecar="$app/Contents/Resources/sidecar/legal-workbench"
          ls -la "$sidecar" || { echo "::error::sidecar 未随包分发"; exit 1; }
          echo "sidecar 大小：$(du -sh "$app/Contents/Resources/sidecar" | cut -f1)"

          # ad-hoc 签名检查：未签名的可执行文件在 Apple Silicon 上会被直接杀掉
          if codesign -dv --verbose=2 "$app" 2>&1 | grep -q 'Signature=adhoc'; then
            echo "外层 .app 已 ad-hoc 签名"
          else
            echo "::error::外层 .app 未签名，Apple Silicon 上无法启动"
            codesign -dv --verbose=2 "$app" 2>&1 || true
            exit 1
          fi
          codesign -dv --verbose=2 "$sidecar" 2>&1 | head -5 || true

          find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -exec ls -la {} \;

      - name: 打包 .app 为 zip（ditto 保留符号链接与可执行位）
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          name=$(basename "$app" .app)
          mkdir -p dist-macos
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist-macos/${name}_${{ matrix.arch }}.app.zip"
          ls -la dist-macos

      - name: 上传构件
        uses: actions/upload-artifact@v4
        with:
          name: legal-workbench-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            dist-macos/*.zip
          if-no-files-found: error
          # dmg / app.zip 本身已是压缩格式，再压一遍纯属浪费
          compression-level: 0

      - name: 发布到 GitHub Release（免登录下载直链）
        # 为什么要这一步：Actions 的构件下载要求登录 GitHub，普通用户拿不到 dmg；
        # 只有 Release 资产才有不需要登录的公开直链。
        # 触发时机：main 分支上的成功构建（每次刷新同一个 Release），
        # 以及打 v* 标签时的正式发布（用标签名作为 Release 名）。
        if: |
          success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # ⚠️ 变量引用一律写成 ${var}，不要写成 $var 直接紧跟中文全角字符！
          # macOS runner 的 `shell: bash` 用的是系统自带的 /bin/bash 3.2.57（不是 Homebrew 的 5.x）。
          # bash 3.2 会把紧跟其后的全角字符（如「（」U+FF08）的字节一并并进变量名，
          # 于是 `$tag（` 被当成变量 `tag（` —— 在 set -u 下直接 unbound variable 退出，
          # 整个 job 会以「0 秒失败」告终，且报错行号指向 shell 内部包装脚本，极难定位。
          # 静态防线见 tests/check_shell_multibyte_vars.py（本地 Git Bash 5.x 复现不了这个坑）。
          ver=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          case "${GITHUB_REF_NAME}" in
            v*) tag="${GITHUB_REF_NAME}" ;;
            *)  tag="v${ver}-macos" ;;
          esac
          echo "release tag = ${tag}（版本 ${ver}）"

          files=$(ls src-tauri/target/release/bundle/dmg/*.dmg dist-macos/*.zip 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::没有可发布的产物"
            exit 1
          fi
          echo "$files"

          # ⚠️ GitHub 会把资产名里的非 ASCII 字符整个剥掉：本地叫
          # `法岩律师本地工作台_0.9.12_aarch64.dmg`，挂到 Release 上会变成
          # `_0.9.12_aarch64.dmg`（中文全没了，只剩一个前导下划线，用户下载下来一脸问号）。
          # 所以上传前先复制成 ASCII 名——**只改"下载文件名"**，
          # dmg 里的 .app 仍叫「法岩律师本地工作台.app」，装到「应用程序」里名字不变。
          mkdir -p dist-release
          for f in $files; do
            base=$(basename "$f")
            # 去掉开头的中文（含其后紧邻的下划线），再接固定前缀：
            #   _0.9.12_aarch64.dmg -> legal-workbench_0.9.12_aarch64.dmg
            #   _arm64.app.zip      -> legal-workbench_arm64.app.zip
            tail_name=$(printf '%s' "$base" | sed -e 's/^[^A-Za-z0-9]*//')
            [ -n "$tail_name" ] || tail_name="$base"
            cp "$f" "dist-release/legal-workbench_${tail_name}"
          done
          echo "将上传为：$(ls dist-release/)"

          # Release 必须先存在才能上传资产。
          # 注意：arm64 与 x64 是两个并行 job，可能同时走到这里抢着创建同一个 tag。
          # 谁先建成功都行，后到的那个拿到"已存在"错误也不该让整个 job 失败，
          # 所以下面用重试 + 以"视图能读到"作为唯一成功判据。
          for i in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag 已存在，直接刷新资产"
              break
            fi
            echo "尝试创建 Release ${tag}（第 ${i} 次）"
            gh release create "$tag" \
              --title "法岩律师本地工作台 ${ver}（macOS）" \
              --notes "macOS 版（Apple Silicon arm64 / Intel x64 各一份）。

          **这是 ad-hoc 签名、未经 Apple 公证的构建**，首次打开可能需要放行：
          安装说明见仓库 README 的「macOS 安装」一节。

          · \`legal-workbench_<版本>_aarch64.dmg\` → Apple 芯片（M 系列）
          · \`legal-workbench_<版本>_x64.dmg\`     → Intel 芯片
          · \`legal-workbench_<架构>.app.zip\`     → 不想用 dmg 时的备用形态（保留符号链接与可执行位）

          下载文件名是 ASCII 的（GitHub 会剥掉资产名里的中文），
          但 dmg 内的应用仍叫「法岩律师本地工作台.app」，拖进「应用程序」后名字不变。" \
              || echo "创建失败（多半是另一个架构刚建好），5 秒后复查"
            sleep 5
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag 创建失败，请检查 workflow 的 contents: write 权限"
            exit 1
          fi

          # 两个架构产出的是不同文件名，互不覆盖；--clobber 只用于重跑时刷新同名资产
          gh release upload "$tag" dist-release/* --clobber

          # 顺手清掉历史上因中文名被剥而残留的旧资产（形如 `_0.9.12_aarch64.dmg`），
          # 否则 Release 页面上会同时挂着新旧两套名字，用户不知道该点哪个。
          # 只删以 `_` 开头的（正是"中文被剥掉"的形态），不动本工作流自己上传的资产。
          for old in $(gh release view "$tag" --json assets -q '.assets[].name'); do
            case "$old" in
              legal-workbench_*) : ;;
              _*) echo "清理历史残留资产：$old"
                  gh release delete-asset "$tag" "$old" --yes || true ;;
            esac
          done

          gh release view "$tag" --json url -q .url

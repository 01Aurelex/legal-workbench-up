name: release-probe

# 【一次性验证工作流，用完即删】
#
# 目的：钉死 build-macos 发布步骤的真实根因。
# 从失败作业日志（用 GITHUB_TOKEN + actions:read 抓到，127KB）里读到的报错原文：
#
#   2026-09-18T20:24:56.3367790Z .../41ac725e-....sh: line 8: tag?: unbound variable
#   2026-09-18T20:24:56.3397500Z ##[error]Process completed with exit code 1.
#
# 该作业的 shell 是 `shell: /bin/bash --noprofile --norc -e -o pipefail {0}`，
# 而 macOS 的 /bin/bash 是 3.2。第 8 行正是：
#   echo "release tag = $tag（版本 $ver）"
# 推断：bash 3.2 把 `$tag` 后面全角括号的首字节吃进了变量名 → 配合 set -u 直接判死，
# 于是在任何 gh 调用之前就退出（所以 1 秒失败、没有 ::error::、仓库里 0 个 Release/tag）。
#
# 本工作流逐条验证该机制，并验证 ${var} 花括号写法可用。

on:
  push:
    paths:
      - ".github/workflows/release-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 验证 /bin/bash 3.2 全角字符陷阱
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: 复现与对照
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/v.txt"
          : > "$OUT"
          {
            echo "== 版本与 locale =="
            echo "PATH 上的 bash: $(command -v bash) -> $(bash --version | head -1)"
            echo "/bin/bash      : $(/bin/bash --version | head -1)"
            echo "locale         : $(locale 2>&1 | tr '\n' ' ')"
            echo ""
            echo "== 用例1  \$tag 后紧跟全角括号（真实写法）=="
            /bin/bash --noprofile --norc -e -o pipefail -c 'set -u; tag=abc; echo "release tag = $tag（版本 1）"' 2>&1
            echo "用例1 rc=$?"
            echo ""
            echo "== 用例2  \${tag} 花括号定界（修复写法）=="
            /bin/bash --noprofile --norc -e -o pipefail -c 'set -u; tag=abc; echo "release tag = ${tag}（版本 1）"' 2>&1
            echo "用例2 rc=$?"
            echo ""
            echo "== 用例3  同用例1 但 LC_ALL=C =="
            LC_ALL=C /bin/bash --noprofile --norc -e -o pipefail -c 'set -u; tag=abc; echo "release tag = $tag（版本 1）"' 2>&1
            echo "用例3 rc=$?"
            echo ""
            echo "== 用例4  同用例1 但用 PATH 上的 bash（Homebrew 5.x）=="
            bash --noprofile --norc -e -o pipefail -c 'set -u; tag=abc; echo "release tag = $tag（版本 1）"' 2>&1
            echo "用例4 rc=$?"
            echo ""
            echo "== 用例5  变量后是 ASCII 字符（对照组）=="
            /bin/bash --noprofile --norc -e -o pipefail -c 'set -u; tag=abc; echo "release tag = $tag (version 1)"' 2>&1
            echo "用例5 rc=$?"
          } > "$OUT" 2>&1
          cat "$OUT"
          B=$(tail -c 2800 "$OUT" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
          [ -z "$B" ] && B="(空)"
          echo "::warning title=probe-bash 全角陷阱验证::${B:0:2900}"

name: release-probe

# 【一次性诊断工作流，用完即删】
#
# 上一轮已把范围缩到一行：复刻脚本的 set -x 轨迹停在
#   + echo 'release tag = v0.0.0-probe4(版本 0.9.12)'
# 之后整段 shell 就没了（退出码 1），而下一行正是
#   files=$(ls src-tauri/target/release/bundle/dmg/*.dmg dist-macos/*.zip 2>/dev/null || true)
# 带 `|| true` 的命令替换理论上不可能判死脚本 —— 所以本轮去掉了 set -e，
# 逐步打 MARK，看究竟停在哪一条、以及那条命令的真实返回值。
#
# 同时重抓失败作业日志：上一轮从日志里按 "发布到 GitHub Release" 找 group 头没找到，
# 本轮直接把清理后的日志「开头 + 结尾」都打出来，先确认日志格式与内容对不对。
#
# 教训：一个步骤发多条 ::warning:: 会被静默丢弃（实测 10 条只落地 3 条）→ 每步只发一条。

on:
  push:
    paths:
      - ".github/workflows/release-probe.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: macOS Release 链路探测
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: A. 抓失败作业日志（首尾都打印）
        shell: bash
        run: |
          set +e
          L="$RUNNER_TEMP/job.log"
          URL="https://api.github.com/repos/01Aurelex/legal-workbench-up/actions/jobs/105748342255/logs"
          INFO=$(curl -sS -L --max-redirs 5 -o "$L" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -w 'http=%{http_code} size=%{size_download}' "$URL" 2>&1)
          echo "curl: $INFO"
          sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$L" | tr -d '\000-\010\013\014\016-\037' > "$RUNNER_TEMP/clean.log"

          {
            echo "INFO=$INFO"
            echo "--- 开头 500 字节 ---"
            head -c 500 "$RUNNER_TEMP/clean.log"
            echo ""
            echo "--- 结尾 2300 字节 ---"
            tail -c 2300 "$RUNNER_TEMP/clean.log"
          } > "$RUNNER_TEMP/seg.log"

          B=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/seg.log" | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
          [ -z "$B" ] && B="(空)"
          echo "::warning title=probe-A 日志首尾::${B:0:2900}"

      - name: B. 逐步复现 files=$(ls ...)（无 set -e，打 MARK）
        shell: bash
        run: |
          set +e
          mkdir -p src-tauri/target/release/bundle/dmg dist-macos
          : > "src-tauri/target/release/bundle/dmg/法岩律师本地工作台_0.9.12_aarch64.dmg"
          : > "dist-macos/法岩律师本地工作台_arm64.app.zip"

          OUT="$RUNNER_TEMP/rel.txt"
          : > "$OUT"

          echo "M1: 造出的文件" >> "$OUT"
          ls -la src-tauri/target/release/bundle/dmg dist-macos >> "$OUT" 2>&1
          echo "M1 rc=$?" >> "$OUT"

          echo "M2: 不带 set -e，原样执行 files=\$(ls ... || true)" >> "$OUT"
          set -x
          files=$(ls src-tauri/target/release/bundle/dmg/*.dmg dist-macos/*.zip 2>/dev/null || true)
          rc2=$?
          set +x
          echo "M2 rc=$rc2 files=[$files]" >> "$OUT"

          echo "M3: 拆开看 ls 单独返回值" >> "$OUT"
          ls src-tauri/target/release/bundle/dmg/*.dmg dist-macos/*.zip > "$RUNNER_TEMP/ls.out" 2>&1
          echo "M3 ls_rc=$? out=$(head -c 300 "$RUNNER_TEMP/ls.out" | tr '\n' '|')" >> "$OUT"

          echo "M4: 带 set -euo pipefail 再跑一次（子 shell 隔离）" >> "$OUT"
          (
            set -euo pipefail
            echo "M4a 进入子 shell"
            f2=$(ls src-tauri/target/release/bundle/dmg/*.dmg dist-macos/*.zip 2>/dev/null || true)
            echo "M4b 赋值成功 f2=[$f2]"
            if [ -z "$f2" ]; then echo "M4c 判定为空 → 会 exit 1"; exit 1; fi
            echo "M4d 判定非空"
          ) >> "$OUT" 2>&1
          echo "M4 子 shell 退出码=$?" >> "$OUT"

          cat "$OUT"
          B=$(tail -c 2900 "$OUT" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
          [ -z "$B" ] && B="(空)"
          echo "::warning title=probe-B 逐步复现::${B}"

name: release-probe

# 【一次性诊断工作流，用完即删】
#
# 已确认的事实：
#   · 失败点不是 gh 缺失 / 权限 / python3 / files 取文件（逐行探针全部 rc=0）
#   · 复刻脚本里唯一失败的是 gh release upload（HTTP 400 Bad Content-Length，针对 0 字节文件）
#   · 仓库里当前 0 个 Release、0 个 tag → 真实运行里 `gh release create` 从未成功
#   · 失败步骤耗时 1 秒 → 不可能走到 5 秒一次的重试 sleep，也不可能真的开始传 100MB
#
# 所以必须看真实那一步的输出。作业日志已经能下载（127KB, http=200），
# 上一轮只是切片位置偏了（尾部 2200 字节全被 checkout 收尾占满）。
# 本轮把日志最后 9000 字节分三段打出来，每段一个步骤、每个步骤只发一条注解。

on:
  push:
    paths:
      - ".github/workflows/release-probe.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: macOS Release 链路探测
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: 下载日志并切片
        shell: bash
        run: |
          set +e
          L="$RUNNER_TEMP/job.log"
          curl -sS -L --max-redirs 5 -o "$L" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/01Aurelex/legal-workbench-up/actions/jobs/105748342255/logs"
          sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$L" | tr -d '\000-\010\013\014\016-\037' > "$RUNNER_TEMP/clean.log"
          wc -c "$RUNNER_TEMP/clean.log"
          # 三个切片，各自开头对齐到整行
          tail -c 9000 "$RUNNER_TEMP/clean.log" | head -c 2500 > "$RUNNER_TEMP/s1.txt"
          tail -c 6500 "$RUNNER_TEMP/clean.log" | head -c 2500 > "$RUNNER_TEMP/s2.txt"
          tail -c 4000 "$RUNNER_TEMP/clean.log" | head -c 2500 > "$RUNNER_TEMP/s3.txt"
          for n in 1 2 3; do echo "切片$n: $(wc -c < "$RUNNER_TEMP/s$n.txt") 字节"; done

      - name: 切片 1（日志倒数 9000~6500 字节）
        shell: bash
        run: |
          B=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/s1.txt" | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
          echo "::warning title=probe-s1::${B:0:2900}"

      - name: 切片 2（日志倒数 6500~4000 字节）
        shell: bash
        run: |
          B=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/s2.txt" | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
          echo "::warning title=probe-s2::${B:0:2900}"

      - name: 切片 3（日志倒数 4000~1500 字节）
        shell: bash
        run: |
          B=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/s3.txt" | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
          echo "::warning title=probe-s3::${B:0:2900}"

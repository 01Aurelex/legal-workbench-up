name: release-probe

# 【一次性诊断工作流，用完即删】
#
# 背景：build-macos 的全部构建步骤都成功（sidecar / 打包 dmg / 校验 / 上传构件），
# 只有最后一步「发布到 GitHub Release」失败：check-run 注解只有一条通用的
# "Process completed with exit code 1."，看不到真实报错。
#
# 已排除的可能（上一个 probe 实测）：gh 2.100.0 在 macOS runner 上存在、
# gh auth 正常、`gh release create --draft` 返回 0、`gh release upload` 返回 0、
# python3 能读出 tauri.conf.json 的版本号 → 说明 token 有 contents: write，
# 问题不在权限、也不在 gh 本身。
#
# 本 probe 要拿到的是**真实那一步的日志原文**：
#   1) 用 GITHUB_TOKEN + actions: read 直接下载失败作业的日志尾部；
#   2) 若日志读不到，就原地复刻发布脚本（set -x）看死在哪一行。
#
# 输出方式：每条结论压进**一条** ::warning:: 注解（换行转义成 %0A）。
# 教训：逐行发多条注解会被静默丢弃（实测一个步骤发 10 条只落地 3 条）。

on:
  push:
    paths:
      - ".github/workflows/release-probe.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    name: macOS Release 链路探测
    runs-on: macos-15
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOB_ID: "105748342255"

    steps:
      - uses: actions/checkout@v4

      - name: A. 用 token 下载失败作业的日志尾部
        shell: bash
        run: |
          set +e
          L="$RUNNER_TEMP/job.log"
          gh api "/repos/01Aurelex/legal-workbench-up/actions/jobs/${JOB_ID}/logs" > "$L" 2>"$RUNNER_TEMP/job.err"
          rc=$?
          echo "gh api logs rc=$rc size=$(wc -c < "$L" 2>/dev/null) err=$(head -c 300 "$RUNNER_TEMP/job.err" | tr '\n' '|')"
          if [ "$rc" -ne 0 ]; then
            B=$(head -c 600 "$RUNNER_TEMP/job.err" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
            echo "::warning title=probe-A 日志不可读::${B}"
            exit 0
          fi
          # 失败步骤的段落：从最后一次出现步骤名开始截取
          awk '/发布到 GitHub Release/{n=NR} {a[NR]=$0} END{for(i=n;i<=NR && i<n+200;i++) print a[i]}' "$L" > "$RUNNER_TEMP/seg.log"
          echo "--- 段落行数=$(wc -l < "$RUNNER_TEMP/seg.log") ---"
          tail -c 3000 "$RUNNER_TEMP/seg.log" | tr -d '\000-\010\013\014\016-\037' \
            | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""}{print $0 "%0A"}' > "$RUNNER_TEMP/body.txt"
          echo "::warning title=probe-A 真实报错原文::$(cat "$RUNNER_TEMP/body.txt")"

      - name: B. 复刻发布脚本（set -x）定位死在哪一行
        shell: bash
        run: |
          set +e
          mkdir -p src-tauri/target/release/bundle/dmg dist-macos
          : > "src-tauri/target/release/bundle/dmg/法岩律师本地工作台_0.9.12_aarch64.dmg"
          : > "dist-macos/法岩律师本地工作台_arm64.app.zip"

          OUT="$RUNNER_TEMP/rel.txt"
          {
            set -x
            set -euo pipefail
            ver=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
            tag="v0.0.0-probe3"
            echo "release tag = $tag（版本 $ver）"
            files=$(ls src-tauri/target/release/bundle/dmg/*.dmg dist-macos/*.zip 2>/dev/null || true)
            if [ -z "$files" ]; then echo "::error::没有可发布的产物"; exit 1; fi
            echo "$files"
            for i in 1 2 3 4 5; do
              if gh release view "$tag" >/dev/null 2>&1; then echo "已存在"; break; fi
              echo "尝试创建（第 $i 次）"
              gh release create "$tag" --title "probe" --notes "probe" || echo "创建失败"
              sleep 5
            done
            gh release upload "$tag" $files --clobber
            gh release view "$tag" --json url -q .url
          } > "$OUT" 2>&1
          set +e
          echo "B 步整体退出码=$?" >> "$OUT"

          echo "--- B 记录 ---"
          cat "$OUT"
          gh release delete v0.0.0-probe3 --yes --cleanup-tag >/dev/null 2>&1

          B=$(tail -c 2600 "$OUT" | tr -d '\000-\010\013\014\016-\037' \
              | sed -e 's/%/%25/g' | awk 'BEGIN{ORS=""}{print $0 "%0A"}')
          echo "::warning title=probe-B 复刻脚本记录::${B}"
